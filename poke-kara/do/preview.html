<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Battle v5 Preview</title>
  <style>
    /* v5 CSS (вырезка) */
    .Battle.pkx-battle-v5{
      width:100%;max-width:1100px;margin:0 auto;padding:10px;display:grid;gap:10px;
      background:#f3f4f6;border:1px solid #e5e7eb;border-radius:14px;box-sizing:border-box;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }
    @media (min-width: 900px){
      .Battle.pkx-battle-v5{
        grid-template-columns:320px 1fr 320px;
        grid-template-areas:"my content enemy" "actions content enemy";
        align-items:start;
      }
    }
    @media (max-width: 899px){
      .Battle.pkx-battle-v5{
        grid-template-columns:1fr 1fr;
        grid-template-areas:"my enemy" ". actions" "content content";
        align-items:start;
      }
    }
    .Battle.pkx-battle-v5 > .PokemonA{grid-area:my;}
    .Battle.pkx-battle-v5 > .PokemonB{grid-area:enemy;}
    .Battle.pkx-battle-v5 > .BattleActions{grid-area:actions;}
    .Battle.pkx-battle-v5 > .Content{grid-area:content;}

    .Battle.pkx-battle-v5 .PokemonBox{
      background:#f9fafb;border:1px solid #e5e7eb;border-radius:14px;padding:10px;
      display:grid;grid-template-columns:150px 1fr;grid-template-areas:"sprite info" "bars info";
      gap:10px;position:relative;box-sizing:border-box;overflow:hidden;
    }
    @media (max-width: 899px){
      .Battle.pkx-battle-v5 .PokemonBox{grid-template-columns:120px 1fr;padding:8px;}
    }
    .Battle.pkx-battle-v5 .PokemonBox .imgPok{
      grid-area:sprite;display:flex;align-items:center;justify-content:center;min-height:110px;
    }
    .Battle.pkx-battle-v5 .PokemonBox .imgPok img{max-width:140px;max-height:140px;}
    @media (max-width: 899px){
      .Battle.pkx-battle-v5 .PokemonBox .imgPok img{max-width:110px;max-height:110px;}
    }
    .Battle.pkx-battle-v5 .PokemonBox .namePokemon{grid-area:info;min-width:0;font-weight:900;}
    .Battle.pkx-battle-v5 .PokemonBox .Ball{position:absolute;left:10px;top:10px;}
    .Battle.pkx-battle-v5 .PokemonBox .Item{position:absolute;right:10px;top:10px;}
    .Battle.pkx-battle-v5 .PokemonBox .Lvl{
      position:absolute;right:10px;bottom:10px;font-weight:800;font-size:12px;
      background:#f3f4f6;border:1px solid #e5e7eb;border-radius:999px;padding:2px 7px;color:#111827;
    }
    .Battle.pkx-battle-v5 .PokemonBox .TrenBadge{
      position:absolute;left:10px;top:42px;font-weight:900;font-size:11px;
      background:#fff;border:1px solid #e5e7eb;border-radius:999px;padding:2px 7px;color:#111827;
    }
    .Battle.pkx-battle-v5 .PokemonBox .Bars{grid-area:bars;display:flex;flex-direction:column;gap:6px;}
    .Battle.pkx-battle-v5 .hp_proggresbar,.Battle.pkx-battle-v5 .exp_progressbar{
      height:10px;border-radius:999px;background:#e5e7eb;overflow:hidden;
    }
    .Battle.pkx-battle-v5 .HpBar{height:100%;background:linear-gradient(90deg,#22c55e,#16a34a);width:72%;}
    .Battle.pkx-battle-v5 .ExpBar{height:100%;background:linear-gradient(90deg,#60a5fa,#3b82f6);width:35%;}
    .Battle.pkx-battle-v5 .SpecialActions{display:flex;gap:8px;justify-content:center;margin-top:2px;}
    .Battle.pkx-battle-v5 .SpecialActions .SpecialBtn{
      border:1px solid #e5e7eb;background:#fff;border-radius:12px;padding:6px 10px;font-weight:900;font-size:12px;cursor:pointer;
    }

    .Battle.pkx-battle-v5 .BattleActions{
      background:#f9fafb;border:1px solid #e5e7eb;border-radius:14px;padding:10px;box-sizing:border-box;
    }
    .Battle.pkx-battle-v5 .MoveBox{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    @media (min-width: 900px){ .Battle.pkx-battle-v5 .MoveBox{grid-template-columns:1fr;} }
    .Battle.pkx-battle-v5 .Move{
      position:relative;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:10px;
      display:flex;gap:10px;align-items:center;box-sizing:border-box;
    }
    .Battle.pkx-battle-v5 .Move .key{
      position:absolute;top:6px;right:8px;font-weight:900;font-size:11px;color:#6b7280;
      background:#f3f4f6;border:1px solid #e5e7eb;border-radius:999px;padding:1px 6px;
    }

    .Battle.pkx-battle-v5 .Content .Zone{
      background:#f9fafb;border:1px solid #e5e7eb;border-radius:14px;padding:8px 10px;
    }
    .Battle.pkx-battle-v5 .Content .Zone .battle-turn{display:flex;align-items:center;justify-content:space-between;gap:10px;}
    .Battle.pkx-battle-v5 .Content .Log{
      margin-top:8px;background:#fff;border:1px solid #e5e7eb;border-radius:14px;
      max-height:150px;overflow:auto;font-size:13px;line-height:1.25;padding:8px 10px;
    }
    @media (max-width: 899px){ .Battle.pkx-battle-v5 .Content .Log{max-height:130px;} }

    .Battle.pkx-battle-v5 .StatusA,.Battle.pkx-battle-v5 .StatusB{
      display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:12px;color:#374151;
    }
    .Battle.pkx-battle-v5 .Log .bgPok{display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin-right:8px;}
    .Battle.pkx-battle-v5 .Log .bgPok img{width:18px;height:18px;vertical-align:middle;}
    .Battle.pkx-battle-v5 .Log .UserLine{display:flex;align-items:center;gap:10px;font-weight:800;margin-top:6px;}
  </style>
</head>
<body style="background:#fff; padding:16px;">

<div class="Battle pkx-battle-v5">

  <div class="PokemonA">
    <div class="PokemonBox">
      <div class="Ball">⚪</div>
      <div class="Item">TM</div>
      <div class="Lvl">Lv 35</div>
      <div class="TrenBadge">TR 4</div>

      <div class="imgPok">
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/6.png" alt="">
      </div>

      <div class="namePokemon">Charizard</div>

      <div class="Bars">
        <div class="hp_proggresbar"><div class="HpBar"></div></div>
        <div class="exp_progressbar"><div class="ExpBar"></div></div>
        <div class="SpecialActions">
          <div class="SpecialBtn">Мега</div>
          <div class="SpecialBtn">Тера</div>
        </div>
      </div>
    </div>
  </div>

  <div class="PokemonB">
    <div class="PokemonBox">
      <div class="Ball">⚪</div>
      <div class="Lvl">Lv 28</div>
      <div class="TrenBadge">TR 2</div>

      <div class="imgPok">
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/59.png" alt="">
      </div>

      <div class="namePokemon">Arcanine</div>

      <div class="Bars">
        <div class="hp_proggresbar"><div class="HpBar" style="width:58%"></div></div>
        <div class="exp_progressbar"><div class="ExpBar" style="width:0%"></div></div>
      </div>
    </div>
  </div>

  <div class="BattleActions">
    <div class="MoveBox">
      <div class="Move"><span class="key">1</span> Огнемёт</div>
      <div class="Move"><span class="key">2</span> Коготь</div>
      <div class="Move"><span class="key">3</span> Укус</div>
      <div class="Move"><span class="key">4</span> Защита</div>
    </div>
  </div>

  <div class="Content">
    <div class="Zone">
      <div class="battle-turn">
        <div class="title" style="font-weight:900;">Ваш ход</div>
        <div style="font-size:12px;color:#6b7280;">Раунд 12 • 00:08</div>
      </div>
      <div class="StatusA"><b>Статусы:</b> 🔥 Поджог • 🧪 Яд</div>
      <div class="StatusB"><b>Статусы:</b> 🧊 Заморозка</div>
    </div>

    <div class="Log">
      <div class="UserLine">
        <span class="bgPok"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/6.png" alt=""> #006 Charizard</span>
        <span>Игрок</span>
      </div>
      <div>Огнемёт наносит урон!</div>

      <div class="UserLine">
        <span class="bgPok"><img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/59.png" alt=""> #059 Arcanine</span>
        <span>Соперник</span>
      </div>
      <div>Укус снижает защиту!</div>
    </div>
  </div>

</div>

</body>
</html>
